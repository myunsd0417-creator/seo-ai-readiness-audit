name: Threads via Buffer

on:
  schedule:
    # Every hour (GitHub often skips or delays scheduled runs). Each run sends today
    # plus the next 4 days (up to 2 posts a day; Buffer free plan holds 10). sent.json prevents duplicates.
    - cron: '13 * * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days ahead to send (1 = tomorrow only)'
        default: '1'
      dry_run:
        description: 'Only show what would be sent'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: threads-buffer
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Send to Buffer
        run: node threads/schedule.mjs
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          POST_TIME: '20:30'
          DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.days || '4' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
      - name: Save sent dates
        if: always()
        run: |
          if ! git diff --quiet threads/sent.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add threads/sent.json
            git commit -m "Record Threads posts sent to Buffer"
            git pull --rebase -q origin main && git push -q origin HEAD:main
          fi
      - name: Open an issue when this fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `自動化が止まりました: ${context.workflow}`;
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            if (open.data.some((i) => i.title === title)) return;
            const url = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner, repo, title,
              body: `「${context.workflow}」が失敗しました。\n\nClaudeにこのページを見せるか、「自動化が止まった」と伝えてください。\n${url}\n\n直ったら、このお知らせは閉じて大丈夫です。`,
            });
