name: Threads via Buffer

on:
  schedule:
    # Every hour (GitHub often skips or delays scheduled runs). Each run sends today
    # plus the next 8 days that are not yet in Buffer (Buffer free plan holds 10). sent.json prevents duplicates.
    - cron: '13 * * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days ahead to send (1 = tomorrow only)'
        default: '1'
      dry_run:
        description: 'Only show what would be sent'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: threads-buffer
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Send to Buffer
        run: node threads/schedule.mjs
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          POST_TIME: '20:30'
          DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.days || '8' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
      - name: Save sent dates
        run: |
          if ! git diff --quiet threads/sent.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add threads/sent.json
            git commit -m "Record Threads posts sent to Buffer"
            git pull --rebase -q origin main && git push -q origin HEAD:main
          fi
