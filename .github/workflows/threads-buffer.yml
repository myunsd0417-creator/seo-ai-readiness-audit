name: Threads via Buffer

on:
  schedule:
    # Every 4 hours. Each run sends the next 2 days that are not yet in Buffer
    # (posted 07:30 JST). sent.json prevents duplicates, so GitHub delays don't matter.
    - cron: '43 */4 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days ahead to send (1 = tomorrow only)'
        default: '1'
      dry_run:
        description: 'Only show what would be sent'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: threads-buffer
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Send to Buffer
        run: node threads/schedule.mjs
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.days || '2' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
      - name: Save sent dates
        run: |
          if ! git diff --quiet threads/sent.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add threads/sent.json
            git commit -m "Record Threads posts sent to Buffer"
            git pull --rebase -q origin main && git push -q origin HEAD:main
          fi
