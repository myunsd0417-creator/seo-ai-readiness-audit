name: Bluesky daily post

on:
  schedule:
    # 00:17 UTC = 09:17 Japan time (evening in the US). Early in the Japan day,
    # so even if GitHub delays the run by hours it still picks the right date.
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      login_only:
        description: 'Only test the login (do not post)'
        type: boolean
        default: true

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Post to Bluesky
        run: node bluesky/post.mjs
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          LOGIN_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.login_only && '1' || '0' }}
