name: Bluesky daily post

on:
  schedule:
    # 00:17 UTC = 09:17 Japan time (evening in the US). Early in the Japan day,
    # so even if GitHub delays the run by hours it still picks the right date.
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      login_only:
        description: 'Only test the login (do not post)'
        type: boolean
        default: true

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Post to Bluesky
        run: node bluesky/post.mjs
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          LOGIN_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.login_only && '1' || '0' }}
      - name: Open an issue when this fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `自動化が止まりました: ${context.workflow}`;
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            if (open.data.some((i) => i.title === title)) return;
            const url = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner, repo, title,
              body: `「${context.workflow}」が失敗しました。\n\nClaudeにこのページを見せるか、「自動化が止まった」と伝えてください。\n${url}\n\n直ったら、このお知らせは閉じて大丈夫です。`,
            });
