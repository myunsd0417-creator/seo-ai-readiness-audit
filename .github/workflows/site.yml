name: Guides site (scheduled guides + sitemap)

# Daily: publishes any queued guide whose date has arrived, then rebuilds the sitemap.
# Also runs when the site or the queue changes.
on:
  schedule:
    # 00:37 UTC = 09:37 Japan time
    - cron: '37 0 * * *'
  push:
    branches: [main]
    paths: ['docs/**', 'guides-queue/**', 'site/**']
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: site-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish due guides and rebuild sitemap
        run: node site/build.mjs
      - name: Commit changes
        run: |
          if git diff --quiet; then echo "Nothing changed."; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          git commit -m "Guides site: publish scheduled guides and update sitemap"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
      - name: Open an issue when this fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `自動化が止まりました: ${context.workflow}`;
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            if (open.data.some((i) => i.title === title)) return;
            const url = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner, repo, title,
              body: `「${context.workflow}」が失敗しました。\n\nClaudeにこのページを見せるか、「自動化が止まった」と伝えてください。\n${url}\n\n直ったら、このお知らせは閉じて大丈夫です。`,
            });
